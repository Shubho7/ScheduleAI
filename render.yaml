services:
  - type: web
    name: scheduleai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python explicitly. Render otherwise defaults to 3.14, which has no
      # prebuilt wheel for pydantic_core==2.33.2 and fails to compile.
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: FALSE
      # Public URL of the service; the Google redirect URI is this + /auth/callback
      - key: APP_BASE_URL
        value: https://scheduleaiv1.onrender.com
      # Encrypts the per-user Google login cookie. Generated once by Render.
      - key: COOKIE_SECRET
        generateValue: true
      # Secrets: entered in the Render dashboard, never committed.
      - key: GOOGLE_API_KEY
        sync: false
      # OAuth client of type "Web application" from Google Cloud Console
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
